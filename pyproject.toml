[project]
name = "room-booking-api"
version = "0.1.0"
description = "Meeting room reservations with PostgreSQL conflict protection"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn[standard]>=0.38,<1", "pydantic[email]>=2.12,<3",
  "pydantic-settings>=2.11,<3", "sqlalchemy>=2.0.44,<2.1", "psycopg[binary]>=3.2.12,<4",
  "alembic>=1.17,<2", "pwdlib[argon2]>=0.3,<1", "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
]
[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "pytest-cov>=7,<8",
    "httpx2>=2.16.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/room_booking"]
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
