name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://booking:ci-only-password@localhost:5432/booking_test
      TEST_DATABASE_URL: postgresql+psycopg://booking:ci-only-password@localhost:5432/booking_test
      JWT_SECRET: ci-only-signing-key-never-use-outside-tests-123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest --cov=room_booking --cov-report=term-missing
      - run: docker build -t room-booking-api:ci .
